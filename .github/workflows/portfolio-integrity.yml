name: Classic Technologies Portfolio Integrity
on:
  push:
    branches: [Master]
  pull_request:
    branches: [Master]
permissions:
  contents: read
jobs:
  portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check portfolio and app evidence
        run: node scripts/check-portfolio.cjs
      - name: Check interactive scripts
        run: |
          node --check assets/project-tabs.js
          node --check assets/site.js
